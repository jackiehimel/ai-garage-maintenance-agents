name: Live maintenance collection
run-name: Maintenance ${{ inputs.correlation }}
on:
  push:
    branches: [codex/recovery-live-agents]
    paths: [.github/workflows/collect.yml]
  workflow_dispatch:
    inputs:
      request:
        description: Validated public website collection request
        required: true
        type: string
      correlation:
        description: Request correlation ID
        required: true
        type: string
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', fromJSON(inputs.request).agentId)) || fromJSON('["seo-ai-search","accessibility","performance"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Collect live browser evidence
        run: npm run collect
        env:
          COLLECT_REQUEST: ${{ inputs.request || format('{{"agentId":"{0}","targetUrl":"https://www.solvd.com/"}}', matrix.agent) }}
          CHROME_PATH: /usr/bin/google-chrome
          DEBUG: pw:browser
      - uses: actions/upload-artifact@v4
        with:
          name: collector-result-${{ matrix.agent }}
          path: collector-result.json
          retention-days: 7
          if-no-files-found: error
