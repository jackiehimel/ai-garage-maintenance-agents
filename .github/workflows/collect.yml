name: Live maintenance collection
run-name: Maintenance ${{ inputs.correlation }}
on:
  workflow_dispatch:
    inputs:
      request:
        description: Validated public website collection request
        required: true
        type: string
      correlation:
        description: Request correlation ID
        required: true
        type: string
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Collect live browser evidence
        run: npm run collect
        env:
          COLLECT_REQUEST: ${{ inputs.request }}
          CHROME_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        with:
          name: collector-result
          path: collector-result.json
          retention-days: 7
          if-no-files-found: error
