name: Live maintenance collection
run-name: Maintenance ${{ inputs.correlation }}
on:
  push:
    branches: [codex/recovery-live-agents]
    paths: [.github/workflows/collect.yml]
  workflow_dispatch:
    inputs:
      request:
        description: Validated public website collection request
        required: true
        type: string
      correlation:
        description: Request correlation ID
        required: true
        type: string
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', fromJSON(inputs.request).agentId)) || fromJSON('["seo-ai-search","accessibility","performance"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: .playwright-browsers
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Install the locked Playwright browser
        run: npx playwright install chromium
      - name: Resolve the Chromium executable
        run: |
          browser_path="$(node --input-type=module -e 'import { chromium } from "playwright"; console.log(chromium.executablePath());')"
          test -x "$browser_path"
          printf 'CHROME_PATH=%s\n' "$browser_path" >> "$GITHUB_ENV"
      - name: Collect live browser evidence
        run: npm run collect
        env:
          COLLECT_REQUEST: ${{ inputs.request || format('{{"agentId":"{0}","targetUrl":"https://www.solvd.com/"}}', matrix.agent) }}
          DEBUG: pw:browser
      - uses: actions/upload-artifact@v4
        with:
          name: collector-result-${{ matrix.agent }}
          path: collector-result.json
          retention-days: 7
          if-no-files-found: error
